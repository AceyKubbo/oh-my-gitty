name: Release

on:
  # 手动打 tag 发版(保留原有入口)
  push:
    tags: ['v*']
  # 版本号提升时由 version-bump 工作流调用
  workflow_call:
    inputs:
      tag:
        description: '要发布的 tag,例如 v0.3.1'
        required: true
        type: string
  # 自动流程失败后,可手动补跑指定 tag(用修复后的工作流代码)
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag,例如 v0.5.0'
        required: true
        type: string

permissions:
  contents: write

# GITHUB_REF_NAME 在 tag push 下是 tag 名;其他触发方式取传入的 tag
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          # 生成更新说明需要完整提交历史与 tag
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 先确保 Release/tag 存在,下一步生成说明时才能解析到当前 tag
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists, reusing it."
          else
            gh release create "$RELEASE_TAG" --draft --title "Oh My Gitty $RELEASE_TAG" --notes "发布说明生成中…"
          fi

          # tag 若已真实存在(tag push 或已发布的 release),先拉到本地供 git log/describe 使用。
          # 注意:未发布的草稿 release 是 untagged 状态,并不会创建 git tag;
          # 这种情况由 release_notes.mjs 回退到 HEAD 生成说明,发布时 GitHub 再创建 tag。
          git fetch --force --tags origin

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 手写说明优先;否则按 Conventional Commits 自动生成分组说明
          manual=".github/RELEASE_NOTES_${RELEASE_TAG}.md"
          if [ -f "$manual" ]; then
            echo "使用手写发布说明: $manual"
            cp "$manual" release-notes.md
          else
            node scripts/release_notes.mjs "$RELEASE_TAG" "AceyKubbo/oh-my-gitty" release-notes.md
          fi
          gh release edit "$RELEASE_TAG" --notes-file release-notes.md

  # 仅支持 Apple Silicon(M 系列);不再构建 Intel/x64 macOS 版本
  build-macos-arm:
    needs: create-release
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Prepare Rust target
        run: rustup target add aarch64-apple-darwin

      - name: Install icon tooling
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install pillow numpy opencv-python-headless
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Use GitHub crates registry
        run: rm -f src-tauri/.cargo/config.toml

      - name: Build Apple Silicon dmg
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/build_mac_dmg.sh aarch64-apple-darwin

      - name: Name Apple Silicon updater artifacts
        run: |
          mv "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Oh My Gitty.app.tar.gz" src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Oh.My.Gitty_aarch64.app.tar.gz
          mv "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Oh My Gitty.app.tar.gz.sig" src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Oh.My.Gitty_aarch64.app.tar.gz.sig

      - name: Validate Apple Silicon packages
        run: |
          codesign --verify --deep --strict --verbose=2 "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Oh My Gitty.app"
          hdiutil verify src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          tar -tzf src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Oh.My.Gitty_aarch64.app.tar.gz >/dev/null

      - name: Upload Apple Silicon dmg
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "$RELEASE_TAG"
          src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Oh.My.Gitty_aarch64.app.tar.gz
          src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Oh.My.Gitty_aarch64.app.tar.gz.sig
          --clobber

  build-windows:
    needs: create-release
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install icon tooling
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install pillow
          # beforeBuildCommand 统一调用 python3;Windows venv 只有 python.exe,补一个兼容 shim
          Copy-Item "$env:GITHUB_WORKSPACE\.venv\Scripts\python.exe" "$env:GITHUB_WORKSPACE\.venv\Scripts\python3.exe"
          "$env:GITHUB_WORKSPACE\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PYTHONPATH=$env:GITHUB_WORKSPACE\.venv\Lib\site-packages" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        run: npm ci

      - name: Use GitHub crates registry
        shell: pwsh
        run: Remove-Item -Force src-tauri/.cargo/config.toml

      - name: Build NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis

      - name: Test release installer lifecycle
        shell: pwsh
        run: |
          $setup = (Resolve-Path "src-tauri/target/release/bundle/nsis/*-setup.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "oh-my-gitty-release"
          $installer = Start-Process -FilePath $setup -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
          if ($installer.ExitCode -ne 0) {
            throw "Installer exited with code $($installer.ExitCode)"
          }

          $exe = Join-Path $installDir "oh-my-gitty.exe"
          if (-not (Test-Path $exe)) {
            throw "Installed executable not found at $exe"
          }
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 5
            if ($process.HasExited) {
              throw "Installed Oh My Gitty exited during startup with code $($process.ExitCode)"
            }
          } finally {
            if (-not $process.HasExited) {
              taskkill.exe /PID $process.Id /T /F
            }
          }

          $uninstaller = Join-Path $installDir "uninstall.exe"
          if (-not (Test-Path $uninstaller)) {
            throw "Uninstaller not found at $uninstaller"
          }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Uninstaller exited with code $($uninstall.ExitCode)"
          }
          Start-Sleep -Seconds 2
          if (Test-Path $exe) {
            throw "Executable remains after uninstall"
          }

      - name: Upload installer to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @()
          $files += (Resolve-Path "src-tauri/target/release/bundle/nsis/*-setup.exe").Path
          $files += (Resolve-Path "src-tauri/target/release/bundle/nsis/*-setup.exe.sig").Path
          gh release upload "$env:RELEASE_TAG" $files --clobber

  publish-release:
    needs: [build-macos-arm, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # 汇总 macOS(Apple Silicon)与 Windows 的更新签名,生成 updater 端点的 latest.json 一并挂到 Release
      - name: Generate update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir sigs
          gh release download "$RELEASE_TAG" --pattern "*.sig" --dir sigs
          gh release view "$RELEASE_TAG" --json body -q .body > release-notes.md || true
          node scripts/release_manifest.mjs "$RELEASE_TAG" "AceyKubbo/oh-my-gitty" sigs latest.json release-notes.md
          gh release upload "$RELEASE_TAG" latest.json --clobber

      # .sig 的内容已经写入 latest.json,无需作为面向用户的 Release 资产展示。
      # 删除前已完成清单生成,不会影响 Tauri updater 的签名校验。
      - name: Remove technical signature assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t signature_assets < <(
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name | select(endswith(".sig"))'
          )
          for asset in "${signature_assets[@]}"; do
            gh release delete-asset "$RELEASE_TAG" "$asset" --yes
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false
